<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>nhap du lieu vao mang</title>
</head>
<body>
<input type="text" name="oNhap" id="oNhap">
<input type="button" value="Thêm vào" id="themVao" onclick="themPhanTuVaoMang()">
<input type="button" value="In ra" id="inRa" onclick="inRaPhanTu()">
<div id="ketQua"></div>
</body>
<script>

  let mang=[];
  function themPhanTuVaoMang(){
  let x=Number(document.getElementById("oNhap").value);
  mang.push(x);
  document.getElementById("oNhap").value="";
  document.getElementById("oNhap").focus();
  }
  function inRaPhanTu(){
    let ketQua ="";
    for (let i = 0; i < mang.length; i++) {
      ketQua +=`Element ${i} = ${mang[i]}<br>`;
    }
    document.getElementById("ketQua").innerHTML= ketQua
  }

</script>
</html>
